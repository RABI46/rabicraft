version: 2
updates:
  # Maintain the Android build's Gradle dependencies
  - package-ecosystem: "gradle"
    directories:
      - "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      gradle-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
