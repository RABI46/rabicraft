name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  # A push to main is the run that publishes coverage; superseded runs there would never finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sonarcloud:
    # Pinned to the reviewed commit so the analysis runs code this fork reviewed.
    uses: storytold/craft-common-actions/.github/workflows/sonarcloud.yml@e8500913a3e3e5e5e029b862da3ed420b0aa26ad
    secrets: inherit
