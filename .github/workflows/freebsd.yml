# Builds and tests the workspace on FreeBSD, inside a FreeBSD VM on a Linux runner
# (GitHub has no FreeBSD runners). GPU tests skip themselves when the VM has no adapter.
name: FreeBSD

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - .github/workflows/freebsd.yml
      - packaging/freebsd/**
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freebsd:
    # Pinned to the reviewed commit (not @main): this fork runs the shared workflow with its own
    # secrets, so a change reaches it only through a reviewed bump of this line.
    uses: storytold/craft-common-actions/.github/workflows/freebsd.yml@e8500913a3e3e5e5e029b862da3ed420b0aa26ad
    with:
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
