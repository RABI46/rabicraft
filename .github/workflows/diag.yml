name: Diag
on: pull_request
permissions:
  contents: read
concurrency:
  group: diag-${{ github.ref }}
  cancel-in-progress: true
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
jobs:
  kotlin:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: tests
        run: |
          mkdir -p packaging/android/app/src/main/assets/web
          printf '<html><body><div id="rabicraft"></div></body></html>' > packaging/android/app/src/main/assets/web/index.html
          (cd packaging/android && gradle --no-daemon :app:testDebugUnitTest) > /tmp/kt.txt 2>&1 || true
          python3 - <<'PY'
          import glob, re
          lines = open('/tmp/kt.txt', errors='replace').read().splitlines()
          for l in [x for x in lines if 'FAILED' in x or 'e: ' in x][:20]:
              print(f"::error title=kt::{l.replace('%','%25')[:1000]}")
          for f in sorted(glob.glob('packaging/android/app/build/test-results/**/*.xml', recursive=True)):
              for m in re.finditer(r'<testcase name="([^"]+)"[^>]*>\s*<failure[^>]*>(.{0,500})', open(f, errors='replace').read(), re.S):
                  print(f"::error title=fail::" + (m.group(1) + ' :: ' + m.group(2)).replace('\n',' ').replace('%','%25')[:1000])
          print("::error title=tail::" + ' | '.join(x.replace('%','%25')[:160] for x in lines[-8:]))
          PY
