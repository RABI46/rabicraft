name: Diag
on: pull_request
permissions:
  contents: read
concurrency:
  group: diag-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: apt
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - name: phone layout
        run: |
          cargo test -p rabicraft-ui-egui --test it -- compact > /tmp/t.txt 2>&1 || true
          python3 - <<'PY'
          lines = open('/tmp/t.txt').read().splitlines()
          for l in lines[-40:]:
              print(f"::error title=test::{l.replace('%','%25')[:1000]}")
          PY
      - name: i18n and chrome units
        run: |
          cargo test -p rabicraft-ui-egui --lib -- i18n:: chrome:: > /tmp/u.txt 2>&1 || true
          python3 - <<'PY'
          lines = open('/tmp/u.txt').read().splitlines()
          for l in lines[-25:]:
              print(f"::error title=unit::{l.replace('%','%25')[:1000]}")
          PY
