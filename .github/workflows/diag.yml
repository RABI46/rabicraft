name: Diag
on: pull_request
permissions:
  contents: read
concurrency:
  group: diag-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plumb:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: versions
        run: |
          curl -sS https://raw.githubusercontent.com/actions/runner-images/main/images/ubuntu/Ubuntu2404-Readme.md > /tmp/img.md || true
          python3 - <<'PY'
          lines = open('/tmp/img.md', errors='replace').read().splitlines()
          hits = [l for l in lines if 'qpdf' in l.lower() or 'poppler' in l.lower()]
          for l in hits[:10]:
              print(f"::error title=img::{l.strip().replace('%','%25')[:400]}")
          print("::error title=count::" + str(len(lines)))
          PY
