name: Diag
on: pull_request
permissions:
  contents: read
jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: fmt
        run: |
          cargo fmt --all -- --check > /tmp/fmt.txt 2>&1 || true
          python3 - <<'PY'
          lines = [l for l in open('/tmp/fmt.txt').read().splitlines() if l.strip()]
          for l in lines[:45]:
              msg = l.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f"::error title=fmt::{msg[:1000]}")
          print(f"::error title=fmt-total::total lines {len(lines)}")
          PY
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: apt
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - name: tests compile
        run: |
          cargo check -p rabicraft-ui-egui --all-targets --message-format short > /tmp/native.txt 2>&1 || true
          python3 - <<'PY'
          lines = [l for l in open('/tmp/native.txt').read().splitlines() if ': error' in l or l.startswith('error')]
          for l in lines[:45]:
              print(f"::error title=native::{l.replace('%','%25')[:1000]}")
          print(f"::error title=native-total::total errors {len(lines)}")
          PY
