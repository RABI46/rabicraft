name: Diag
on: pull_request
permissions:
  contents: read
concurrency:
  group: diag-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@eddaf203b2d4873525a69842240214b23bac65ba
    with:
      os: '["ubuntu-24.04"]'
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      packages: >-
        libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
        libgtk-3-dev qpdf poppler-utils
      tools: cargo-nextest@0.9.150,cargo-deny@0.20.2
      linux-env: RABICRAFT_ORACLES_REQUIRED=1
      command: |
        set -uo pipefail
        cargo xtask ci > /tmp/ci.txt 2>&1
        status=$?
        python3 - "$status" <<'PY'
        import re, sys
        status = sys.argv[1]
        lines = open('/tmp/ci.txt', errors='replace').read().splitlines()
        keep = [l for l in lines if '=== ci:' in l]
        keep += [l for l in lines if re.search(r'^error(\[|:)', l) or 'panicked' in l or 'FAILED' in l or l.startswith('CI:') or l.startswith('error:')]
        for l in keep[:60]:
            print("::error title=probe::" + l.replace('%', '%25')[:900])
        for i, l in enumerate(lines):
            if re.search(r'^error(\[|:)', l):
                for extra in lines[max(0, i - 3):i + 8]:
                    print("::error title=ctx::" + extra.replace('%', '%25')[:900])
                break
        print("::error title=status::status=" + status)
        PY
        exit 1
