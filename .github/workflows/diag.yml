name: Diag
on: pull_request
permissions:
  contents: read
concurrency:
  group: diag-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: apt
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev qpdf poppler-utils
      - name: xtask ci
        run: |
          cargo xtask ci > /tmp/ci.txt 2>&1 || true
          python3 - <<'PY'
          import re
          lines = open('/tmp/ci.txt', errors='replace').read().splitlines()
          keep = [l for l in lines if '=== ci:' in l or 'CI:' in l or re.search(r'^(error|warning)(\[|:)', l) or '--> ' in l or 'FAILED' in l or 'panicked' in l]
          for l in keep[:60]:
              print(f"::error title=ci::{l.replace('%','%25')[:1000]}")
          print(f"::error title=ci-tail::" + ' | '.join(x.replace('%','%25')[:200] for x in lines[-12:]))
          PY
