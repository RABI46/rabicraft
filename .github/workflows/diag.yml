name: Diag
on: pull_request
permissions:
  contents: read
concurrency:
  group: diag-${{ github.ref }}
  cancel-in-progress: true
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
jobs:
  kotlin:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: tests
        run: |
          mkdir -p packaging/android/app/src/main/assets/web
          (cd packaging/android && gradle --no-daemon :app:testDebugUnitTest) > /tmp/kt.txt 2>&1 || true
          python3 - <<'PY'
          import glob, re
          lines = open('/tmp/kt.txt', errors='replace').read().splitlines()
          keep = [l for l in lines if 'FAILED' in l or 'e: ' in l or 'error:' in l or 'Test' in l and '>' in l]
          for l in keep[:40]:
              print(f"::error title=kt::{l.replace('%','%25')[:1000]}")
          for f in sorted(glob.glob('packaging/android/app/build/reports/tests/**/*.html', recursive=True))[:0]:
              pass
          for f in sorted(glob.glob('packaging/android/app/build/test-results/**/*.xml', recursive=True)):
              text = open(f, errors='replace').read()
              for m in re.finditer(r'<testcase name="([^"]+)"[^>]*>\s*<failure[^>]*>(.{0,600})', text, re.S):
                  msg = (m.group(1) + ' :: ' + m.group(2)).replace('\n', ' ')
                  print(f"::error title=fail::{msg.replace('%','%25')[:1000]}")
          print("::error title=tail::" + ' | '.join(x.replace('%','%25')[:180] for x in lines[-15:]))
          PY
