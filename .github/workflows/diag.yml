name: Diag
on: pull_request
permissions:
  contents: read
concurrency:
  group: diag-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@eddaf203b2d4873525a69842240214b23bac65ba
    with:
      os: '["ubuntu-24.04"]'
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      packages: >-
        libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
        libgtk-3-dev qpdf poppler-utils
      tools: cargo-nextest@0.9.150,cargo-deny@0.20.2
      linux-env: RABICRAFT_ORACLES_REQUIRED=1
      command: |
        set -uo pipefail
        cargo xtask ci > /tmp/ci.txt 2>&1
        status=$?
        python3 - "$status" <<'PY'
        import re, sys
        status = sys.argv[1]
        lines = [re.sub(r'\x1b\[[0-9;]*m', '', l) for l in open('/tmp/ci.txt', errors='replace').read().splitlines()]
        out = [l for l in lines if '=== ci:' in l]
        for i, l in enumerate(lines):
            if re.search(r'^(error|FAILED|failures:)|panicked at|test result: FAILED', l):
                out.extend(lines[max(0, i - 8):i + 14])
        out.extend(lines[-30:])
        for l in out:
            if l.strip():
                print("::error title=probe::" + l.replace('%', '%25')[:900])
        print("::error title=status::xtask ci exited " + status)
        PY
        exit "$status"
