name: Android

# Builds the side-loadable APK: the browser build (apps/rabicraft-web) in a WebView, with the host
# bridge in packaging/android. No store, no account: the artifact is installable on any phone that
# allows unknown sources (packaging/android/README.md).
#
# A build on every change to the Android package or the browser build; an APK kept as an artifact on
# `main`, a manual run and a release. Nothing is published anywhere.
on:
  push:
    branches: [main, release]
    paths:
      - "packaging/android/**"
      - "apps/rabicraft-web/**"
      - "crates/ui-egui/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "packaging/android/**"
      - "apps/rabicraft-web/**"
      - "crates/ui-egui/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    name: APK (arm64-v8a, armeabi-v7a, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # The runner images ship the SDK and a JDK; this is where they are.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out craft-i18n
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@eddaf203b2d4873525a69842240214b23bac65ba
      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install trunk
        run: |
          set -euo pipefail
          # Trunk fetches the wasm-bindgen CLI its build needs by itself, matching Cargo.lock's
          # `wasm-bindgen` version, so only trunk is pinned here.
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin trunk
          trunk --version
      - name: Install Java and Gradle
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the Android SDK packages
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.14.3"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          key: android
      - name: Build the APK
        run: |
          set +e
          packaging/android/package.sh > "$RUNNER_TEMP/build.log" 2>&1
          rc=$?
          sed -e 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/plain.log"
          tail -40 "$RUNNER_TEMP/plain.log"
          if [ "$rc" -ne 0 ]; then
            # The job log is not always retrievable from outside; annotations are.
            n=0
            grep -E 'error|e: |FAILURE|What went wrong|trunk|Caused by' "$RUNNER_TEMP/plain.log" | tail -12 | while IFS= read -r line; do
              n=$((n + 1))
              printf '::error title=build %s::%s\n' "$n" "${line:0:900}"
            done
            exit "$rc"
          fi
          # The page inside the APK must be the browser build, not an empty folder.
          unzip -l dist/release/rabicraft-*-android.apk | grep -q 'assets/web/index.html'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # The job log is not always retrievable from outside the run; the build's own output is.
        if: failure()
        with:
          name: android-build-log
          path: ${{ runner.temp }}/plain.log
          if-no-files-found: ignore
          retention-days: 5
      - name: Test the host page
        run: |
          set -euo pipefail
          # The Kotlin tests pin the messages the page exchanges with apps/rabicraft-web's host
          # module and the MIME types the browser build needs.
          cd packaging/android && gradle --no-daemon :app:testDebugUnitTest
      - name: Check the signature a phone will show
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/release/rabicraft-*-android.apk | head -5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Kept for main, manual runs and releases; a pull request only checks that it builds.
        if: github.event_name != 'pull_request'
        with:
          name: rabicraft-android-apk
          path: dist/release/rabicraft-*-android.apk
          if-no-files-found: error
          retention-days: 30
