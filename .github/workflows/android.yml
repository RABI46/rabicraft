name: Android

# Builds the side-loadable APK: the browser build (apps/rabicraft-web) in a WebView, wrapped by the
# code in packaging/android. No store, no account: the artifact installs on any phone that allows
# unknown sources (packaging/android/README.md).
#
# Runs when the Android package or the browser build changes. An APK is kept as an artifact on
# `main`, on a manual run and on a release; a pull request only checks that it builds.
on:
  push:
    branches: [main, release]
    paths:
      - "packaging/android/**"
      - "apps/rabicraft-web/**"
      - "crates/ui-egui/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "packaging/android/**"
      - "apps/rabicraft-web/**"
      - "crates/ui-egui/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    name: APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # The runner image ships the SDK and a JDK; this is where they are.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out craft-i18n
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@fd14193f062cd71f9de9426bd450aa0adad670f0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install trunk
        run: |
          set -euo pipefail
          # Trunk downloads the wasm-bindgen CLI matching Cargo.lock's version by itself, so only
          # trunk is pinned here.
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin trunk
          trunk --version
      - name: Install Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the Android SDK packages
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.14.3"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          key: android
      - name: Build the APK
        run: |
          set -euo pipefail
          packaging/android/package.sh
          # The page inside the APK must be the browser build, not an empty folder.
          unzip -l dist/release/rabicraft-*-android.apk | grep -q 'assets/web/index.html'
      - name: Test the host page
        run: |-
          set -euo pipefail
          # The Kotlin tests pin the messages the page exchanges with apps/rabicraft-web's host
          # module, and the MIME types the browser build needs.
          cd packaging/android
          gradle --no-daemon :app:testDebugUnitTest
      - name: Check the signature a phone will show
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/release/rabicraft-*-android.apk | head -5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Kept for main, manual runs and releases; a pull request only checks that it builds.
        if: github.event_name != 'pull_request'
        with:
          name: rabicraft-android-apk
          path: dist/release/rabicraft-*-android.apk
          if-no-files-found: error
          retention-days: 30
