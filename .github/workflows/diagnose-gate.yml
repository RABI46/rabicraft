name: Diagnose gate

# TEMPORARY: the gate's job logs cannot be fetched from the maintainer's environment, but its
# check-run annotations can. This calls the same gate workflow and ships the interesting slice of
# `cargo xtask ci` output back as chunked annotations. Deleted once green.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@eddaf203b2d4873525a69842240214b23bac65ba
    with:
      os: '["ubuntu-24.04"]'
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      packages: >-
        libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
        libgtk-3-dev qpdf poppler-utils
      tools: cargo-nextest@0.9.150,cargo-deny@0.20.2
      env: RABICRAFT_ORACLES_REQUIRED=1
      command: |
        set +e
        cargo xtask ci > "$RUNNER_TEMP/gate.log" 2>&1
        rc=$?
        echo "cargo xtask ci exited with $rc"
        sed -e 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/gate.log" > "$RUNNER_TEMP/plain.log"
        grep -n '=== ci:' "$RUNNER_TEMP/plain.log" | tail -2
        grep -vE '^\s*(Compiling|Checking|Downloaded|Downloading|Adding|Updating|Locking|Blocking)' "$RUNNER_TEMP/plain.log" > "$RUNNER_TEMP/quiet.log"
        { echo "=== ci markers ==="
          grep -E '^=== ci:|^CI: ' "$RUNNER_TEMP/plain.log"
          echo "=== last 220 quiet lines ==="
          tail -220 "$RUNNER_TEMP/quiet.log"
        } > "$RUNNER_TEMP/slice.txt"
        rm -f "$RUNNER_TEMP"/part-*
        split -b 2400 "$RUNNER_TEMP/slice.txt" "$RUNNER_TEMP/part-"
        n=0
        for f in "$RUNNER_TEMP"/part-*; do
          n=$((n + 1))
          [ "$n" -le 12 ] || break
          printf '::error title=slice %s::%s\n' "$n" "$(gzip -9 -c "$f" | base64 -w0)"
        done
        exit "$rc"
