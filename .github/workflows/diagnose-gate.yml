name: Diagnose gate

# TEMPORARY: the gate's job logs cannot be fetched from the maintainer's environment, but its
# check-run annotations can. This calls the same gate workflow and ships the interesting slice of
# `cargo xtask ci` output back as chunked annotations. Deleted once green.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@eddaf203b2d4873525a69842240214b23bac65ba
    with:
      os: '["ubuntu-24.04"]'
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      packages: >-
        libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
        libgtk-3-dev qpdf poppler-utils
      tools: cargo-nextest@0.9.150,cargo-deny@0.20.2
      env: RABICRAFT_ORACLES_REQUIRED=1
      command: |
        set +e
        cargo xtask ci > "$RUNNER_TEMP/gate.log" 2>&1
        rc=$?
        echo "cargo xtask ci exited with $rc"
        grep -n '=== ci:' "$RUNNER_TEMP/gate.log" | tail -3
        # The slice from the last step marker on, plus every compiler/test error line.
        start=$(grep -n '=== ci:' "$RUNNER_TEMP/gate.log" | tail -1 | cut -d: -f1)
        { echo "--- from line $start ---"
          [ -n "$start" ] && tail -n +"$start" "$RUNNER_TEMP/gate.log" | head -260
          echo "--- error lines ---"
          grep -n -E '^error|^warning: unused|FAILED|panicked|^  --> ' "$RUNNER_TEMP/gate.log" | head -60
        } > "$RUNNER_TEMP/slice.txt"
        gzip -9 -c "$RUNNER_TEMP/slice.txt" | base64 -w0 | fold -w 3500 > "$RUNNER_TEMP/part-00"
        n=0
        while IFS= read -r part; do
          n=$((n + 1))
          [ "$n" -le 12 ] || break
          printf '::error title=slice %s::%s\n' "$n" "$part"
        done < "$RUNNER_TEMP/part-00"
        exit "$rc"
