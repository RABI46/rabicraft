# Windows on ARM (#61): package the ARM64 release the way release.yml does (cross-compiled on an
# x64 runner, unsigned here), then install that MSI on a Windows 11 ARM64 runner and run it, and
# run the test suite natively on ARM64.
name: Windows ARM64

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - "**/build.rs"
      - .github/workflows/windows-arm64.yml
      - packaging/windows/**
  schedule:
    - cron: "41 4 * * 1" # weekly, so drift in the runner images shows up
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-arm64:
    # Pinned to the reviewed commit (not @main): this fork runs the shared workflow with its own
    # secrets, so a change reaches it only through a reviewed bump of this line.
    uses: storytold/craft-common-actions/.github/workflows/windows-arm64.yml@e8500913a3e3e5e5e029b862da3ed420b0aa26ad
    with:
      app-name: rabicraft
      app-dir: RabiCraft
      install-relative-path: Programs/ArtCraft/RabiCraft
      install-scope: perUser
